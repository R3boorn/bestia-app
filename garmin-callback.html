<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>BESTIA · Garmin connection</title>
<style>:root{--bg:#0b0b0c;--fg:#f3f3f1;--mut:#a3a3a8;--acc:#e8462a}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:560px;margin:0 auto;padding:64px 20px}h1{font-size:28px;margin:0 0 12px}.mut{color:var(--mut)}a{color:#ff7a4d}</style>
</head>
<body>
<main>
<h1 id="h">Connecting your Garmin account…</h1>
<p id="m" class="mut">Please wait. / Proszę czekać.</p>
<p class="mut"><a href="./">BESTIA</a> · <a href="privacy-policy.html">Privacy Policy</a></p>
</main>
<script>
// Garmin OAuth2 redirect target. Forwards code and state to the BESTIA backend (Google Apps Script web app).
// The backend id travels inside "state" (nonce~deploymentId). Only script.google.com/macros/s/<id>/exec is allowed.
var BACKEND_URL = "";
function bestiaBackend(state) {
  if (BACKEND_URL) return BACKEND_URL;
  var parts = String(state || "").split("~");
  if (parts.length !== 2 || !/^[A-Za-z0-9_-]{20,120}$/.test(parts[1])) return "";
  return "https://script.google.com/macros/s/" + parts[1] + "/exec";
}
(function(){
  var q = new URLSearchParams(location.search), h = document.getElementById("h"), m = document.getElementById("m");
  if (q.get("error")) { h.textContent = "Connection cancelled"; m.textContent = "Garmin returned: " + q.get("error") + ". You can close this page. / Połączenie anulowane, możesz zamknąć stronę."; return; }
  if (!q.get("code")) { h.textContent = "BESTIA · Garmin connection"; m.textContent = "This page completes the connection between a Garmin Connect account and BESTIA. / Ta strona kończy łączenie konta Garmin Connect z BESTIĄ."; return; }
  var b = bestiaBackend(q.get("state"));
  if (b) { location.replace(b + "?code=" + encodeURIComponent(q.get("code")) + "&state=" + encodeURIComponent(q.get("state") || "")); return; }
  var st = String(q.get("state") || "");
  if (/^[A-Za-z0-9_-]{8,64}$/.test(st)) {
    var kod = st + "!" + q.get("code");
    h.textContent = "Almost done: copy this code / Prawie gotowe: skopiuj kod";
    m.textContent = "Copy the code and paste it in the BESTIA window in your spreadsheet. / Skopiuj kod i wklej go w okienku BESTIA w arkuszu (kod działa 15 min, tylko raz).";
    var box = document.createElement("div");
    box.innerHTML = '<input id="kod" readonly style="width:100%;padding:10px;font:14px monospace;box-sizing:border-box;margin:8px 0"><button id="kop" style="background:#e8462a;color:#fff;border:0;padding:10px 18px;border-radius:8px;font-weight:bold;font-size:16px">Kopiuj / Copy</button> <span id="ok" class="mut"></span>';
    m.parentNode.insertBefore(box, m.nextSibling);
    var inp = document.getElementById("kod"); inp.value = kod;
    document.getElementById("kop").onclick = function(){ inp.select(); var done = function(){ document.getElementById("ok").textContent = "Skopiowano / Copied"; };
      if (navigator.clipboard) navigator.clipboard.writeText(kod).then(done, function(){ document.execCommand("copy"); done(); }); else { document.execCommand("copy"); done(); } };
    return;
  }
  h.textContent = "Connection link not recognised"; m.textContent = "Please start again from the BESTIA menu. / Nie rozpoznano linku, zacznij ponownie z menu BESTIA w arkuszu.";
})();
</script>
</body>
</html>
