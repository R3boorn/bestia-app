<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>BESTIA · Garmin connection</title>
<style>:root{--bg:#0b0b0c;--fg:#f3f3f1;--mut:#a3a3a8;--acc:#e8462a}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:560px;margin:0 auto;padding:64px 20px}h1{font-size:28px;margin:0 0 12px}.mut{color:var(--mut)}a{color:#ff7a4d}</style>
</head>
<body>
<main>
<h1 id="h">Connecting your Garmin account…</h1>
<p id="m" class="mut">Please wait. / Proszę czekać.</p>
<p class="mut"><a href="./">BESTIA</a> · <a href="privacy-policy.html">Privacy Policy</a></p>
</main>
<script>
// Garmin OAuth2 redirect target. Forwards code and state to the BESTIA backend.
// BACKEND_URL is set when the backend is deployed; until then the page only reports the result.
var BACKEND_URL = "";
(function(){
  var q = new URLSearchParams(location.search), h = document.getElementById("h"), m = document.getElementById("m");
  if (q.get("error")) { h.textContent = "Connection cancelled"; m.textContent = "Garmin returned: " + q.get("error") + ". You can close this page. / Połączenie anulowane, możesz zamknąć stronę."; return; }
  if (!q.get("code")) { h.textContent = "BESTIA · Garmin connection"; m.textContent = "This page completes the connection between a Garmin Connect account and BESTIA. / Ta strona kończy łączenie konta Garmin Connect z BESTIĄ."; return; }
  if (BACKEND_URL) { location.replace(BACKEND_URL + "?code=" + encodeURIComponent(q.get("code")) + "&state=" + encodeURIComponent(q.get("state") || "")); return; }
  h.textContent = "Garmin account authorised"; m.textContent = "Authorisation received. BESTIA is not yet ready to finish the connection; please try again later. / Zgoda przyjęta, BESTIA dokończy połączenie w kolejnej wersji.";
})();
</script>
</body>
</html>
